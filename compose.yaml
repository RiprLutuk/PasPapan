name: paspapan

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    container_name: paspapan-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      API_BIND: 0.0.0.0:3000
      # Deployment-specific database, origins and secrets come from apps/api/.env.
      STORAGE_LOCAL_ROOT: /var/lib/paspapan/objects
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - paspapan_objects:/var/lib/paspapan/objects
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    command: ["paspapan-worker"]
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Containerfile
    container_name: paspapan-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      API_PROXY_TARGET: http://api:3000
      # ORIGIN and API_INTERNAL_KEY come from apps/web/.env.
    ports:
      - "${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  paspapan_objects:
